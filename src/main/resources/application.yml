spring:
  application:
    name: sentinel-trade
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sentineltrade}
    username: ${DB_USER:sentinel_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # the schema is owned by Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080
  # <<no down-flow>>: never leak internals in error responses
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health

# <<data security>>: mask sensitive values that might reach a log line
logging:
  pattern:
    console: "%d{ISO8601} %5p [%t] %logger{36} - %replace(%msg){'(?i)(password|secret|token|code)=\\S+','$1=***'}%n"

app:
  security:
    jwt-secret: ${JWT_SIGNING_KEY:}
    jwt-issuer: sentinel-trade
    pre-auth-token-ttl: PT5M
    access-token-ttl: PT15M
    mfa-encryption-key: ${MFA_SECRET_ENCRYPTION_KEY:}
  market:
    volatility: 0.005
  exchange:
    timeout-rate: ${EXCHANGE_TIMEOUT_RATE:0}
    liquidity-per-check: 1000
    price-band: 0.20
    order-ttl: PT8H
  reconciler:
    interval: PT5S
    grace: PT2S
  seed:
    enabled: ${SEED_DEMO_DATA:false}
    password: ${DEMO_PASSWORD:}
    mfa-secret: ${DEMO_MFA_SECRET:}
